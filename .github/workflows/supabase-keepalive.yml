name: supabase-keepalive

# Writes one row to public.heartbeat so Supabase does not pause this free-tier
# project for inactivity. Spec: docs/Tech.md §15, docs/DB.md §5.13 and §7.3.
#
# SUPABASE_ANON_KEY is the project's anon key, constrained by the insert-only
# RLS policy on `heartbeat` (no SELECT, no UPDATE, no DELETE, and
# WITH CHECK (source = 'github-action')). The SERVICE ROLE KEY MUST NEVER be
# used here or stored as a repository secret — it bypasses RLS on every table,
# and a leak there is total exposure of every lead.
#
# The secret names deliberately differ from .env.local's NEXT_PUBLIC_* names:
# different key, different trust boundary. See README.md § Keep-alive.
#
# Note the spelling "SERVICE ROLE KEY" with spaces, above and throughout this
# file. `verify:keepalive` O6 scans every file under .github/** for the literal
# identifier and for JWTs whose payload carries that role; writing the
# identifier here — even inside a comment saying never to use it — reddens O6.
# Keep prose spellings spaced.

on:
  schedule:
    # 06:17 UTC. The minute offset avoids the top-of-hour spike when every
    # scheduled GitHub Action fires at once and queues.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets are present and well-formed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Repository secret SUPABASE_URL is empty or unset."
            missing=1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository secret SUPABASE_ANON_KEY is empty or unset."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::See README.md section 'Keep-alive' for how to create both secrets."
            exit 1
          fi
          # A pasted dashboard URL (https://supabase.com/dashboard/project/...)
          # 404s in a way that reads as "project paused". Fail fast instead.
          # Relax this check if the project ever moves to a custom domain.
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error::SUPABASE_URL must look like https://<project-ref>.supabase.co. Do not use the dashboard URL."
              exit 1
              ;;
          esac

          # The one invariant this whole workflow exists to protect, asserted
          # rather than eyeballed. Pasting the wrong key from the same dashboard
          # page is the plausible slip, and it is silent: the insert would
          # succeed, so nothing else here would ever notice.
          #
          # Decode the JWT payload and refuse a privileged role. The eyJ* gate
          # keeps this correct for non-JWT publishable keys (sb_publishable_*),
          # which carry no role claim and are skipped rather than rejected.
          case "$SUPABASE_ANON_KEY" in
            eyJ*)
              payload=$(printf '%s' "$SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/+')
              case $(( ${#payload} % 4 )) in
                2) payload="$payload==" ;;
                3) payload="$payload=" ;;
              esac
              # The `.` in the pattern is a wildcard standing in for the
              # underscore, so this file does not contain the literal
              # identifier that O6 forbids. Do not "correct" it.
              if printf '%s' "$payload" | base64 -d 2>/dev/null \
                | grep -qE '"role"[[:space:]]*:[[:space:]]*"service.role"'; then
                echo "::error::SUPABASE_ANON_KEY holds a privileged JWT, not the anon key. Replace the secret with the anon key and rotate the leaked key in the Supabase dashboard now — a key with that role bypasses RLS on every table."
                exit 1
              fi
              ;;
          esac

      - name: Insert heartbeat row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # GitHub runs `run:` blocks with `bash -e`, so a non-zero curl exit
          # would abort this step before the assertion below and the message
          # would be lost. Capture the exit code with `|| rc=$?` instead.
          #
          # --fail-with-body: on >=400, still write PostgREST's error JSON to
          # the body file. That JSON names the policy that rejected the write.
          #
          # No --retry-all-errors: retry transient failures only — timeouts and
          # HTTP 408/429/5xx. A connection refused is NOT retried without
          # --retry-connrefused, and that is fine: a refused connection here
          # means the project is paused, which retrying will not fix. A 401
          # from a bad secret must fail immediately.
          #
          # --retry 3 means up to FOUR attempts and three delays, and --max-time
          # applies per attempt, so the worst case is 4x30s + 3x10s = 150s —
          # inside timeout-minutes: 5 with room to spare.
          rc=0
          code=$(curl -sS \
            --fail-with-body \
            --retry 3 --retry-delay 10 \
            --connect-timeout 10 --max-time 30 \
            -o /tmp/keepalive-body.txt \
            -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/heartbeat" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"source":"github-action"}') || rc=$?

          # Recorded before the assertion so the failure step can read them.
          echo "HTTP_CODE=$code" >> "$GITHUB_ENV"
          echo "CURL_RC=$rc" >> "$GITHUB_ENV"

          # --fail alone cannot distinguish "inserted" from "some other 2xx".
          # Assert 201 explicitly on the one call that keeps the database alive.
          if [ "$rc" -ne 0 ] || [ "$code" != "201" ]; then
            echo "::error::heartbeat insert failed (curl exit $rc, HTTP $code)"
            exit 1
          fi
          echo "heartbeat row inserted (HTTP 201)"

      - name: Diagnose failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # Host only — never the full URL, never the key. GitHub masks the
          # exact secret string; the extracted host is a substring and prints,
          # which is intended: the project ref is public (it is the subdomain
          # of every client-side Supabase URL).
          host=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')
          echo "host:      ${host:-<unset>}"
          echo "http code: ${HTTP_CODE:-<none>}"
          echo "curl exit: ${CURL_RC:-<none>}"
          echo "response body:"
          cat /tmp/keepalive-body.txt 2>/dev/null || echo "  <no body captured>"
          echo ""
          echo "Triage, most likely first:"
          echo "  1. The Supabase project is PAUSED. Unpause it in the dashboard, then re-run this workflow."
          echo "  2. SUPABASE_ANON_KEY was rotated, or the legacy JWT key was disabled during a"
          echo "     migration to publishable keys. Update the repository secret."
          echo "  3. The heartbeat_insert_only RLS policy changed. The response body above names"
          echo "     the rejecting policy."
          echo "  4. SUPABASE_URL points at the wrong project."
          echo "See README.md section 'Keep-alive'."
